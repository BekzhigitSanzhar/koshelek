/* ---------- Быстрые траты из «Команд» iPhone ---------- */
// Ссылка вида ?t=<текст>&src=applepay|sms добавляет трату сразу при оплате.
function takeQuickFromUrl() {
  let p;
  try { p = new URLSearchParams(location.search); } catch { return; }
  if (!p.has('t')) return;
  const text = p.get('t'), src = p.get('src') || '';
  try { history.replaceState(null, '', location.pathname); } catch {}
  const q = Ledger.parseQuick(text, src, S.meta.rules);
  if (!q) {
    openSheet(`<h3>Не удалось разобрать трату</h3><div class="orig">${esc(text)}</div>
      <div class="note">Добавьте её вручную или пришлите этот текст, чтобы я научил приложение его понимать.</div>
      <div class="btns"><button class="btn primary" id="qAdd">Добавить вручную</button><button class="btn" id="qClose">Закрыть</button></div>`, root => {
      root.querySelector('#qClose').onclick = () => sheet.close();
      root.querySelector('#qAdd').onclick = () => openAdd();
    });
    return;
  }
  // Защита от повторного открытия той же ссылки: одинаковая трата в течение двух минут не добавляется дважды.
  const now = Date.now();
  const recent = allTx().find(t => t.quick && t.cents === q.cents && t.det === q.det && now - (t.at || 0) < 120000);
  if (recent) { openTx(recent); return; }
  const accKey = q.bank === 'kaspi' ? 'kaspi-gold-KZT' : q.bank === 'freedom' ? 'freedom-' + q.cur : 'cash';
  const tx = { ...q, id: 'q_' + uid(), manual: true, quick: true, acc: accKey, date: today(), at: now };
  putTx(tx); S.month = monthOf(tx.date); render();
  openSheet(`<h3>${tx.cents < 0 ? 'Трата записана' : 'Поступление записано'}</h3>
    <div class="row"><span class="mid num">${fmt(tx.cents, tx.cur, { sign: true })}</span><span class="pill">${esc(srcLabel(tx.src))}</span></div>
    <div class="orig">${esc(tx.det || '—')} · ${esc(BANKS[tx.bank] || 'карта')}</div>
    <div class="note">Категория: <b>${esc(tx.cat)}</b>. Когда загрузите выписку, эта трата совпадёт с банковской и не посчитается дважды.</div>
    ${budget().month || budget().day ? (() => { const a = dailyAllowance(); const r = a.allow - a.spentToday; return `<div class="today ${r < 0 ? 'over' : ''}"><span class="small muted">${r >= 0 ? 'Сегодня можно ещё' : 'Сегодня сверх лимита'}</span><span class="mid num">${fmt(Math.abs(r), 'KZT', { whole: true })}</span></div>`; })() : ''}
    <div class="btns"><button class="btn primary" id="qOk">Готово</button><button class="btn" id="qEdit">Изменить</button></div>`, root => {
    root.querySelector('#qOk').onclick = () => sheet.close();
    root.querySelector('#qEdit').onclick = () => openTx(tx);
  });
}

/* ---------- Импорт PDF ---------- */
async function pdfItems(buf) {
  const doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  const items = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    for (const i of tc.items) if (i.str && i.str.trim()) items.push({ page: p, x: i.transform[4], y: i.transform[5], s: i.str });
  }
  return items;
}

async function handleFiles(files) {
  if (!files.length) return;
  if (!window.pdfjsLib) { S.pendingImport = { file: files[0].name, error: 'Модуль чтения PDF не загрузился. Проверьте интернет и откройте страницу заново.' }; render(); return; }
  S.pendingImport = null;
  $('#preview').innerHTML = '<div class="card"><div class="muted">Читаю выписку…</div></div>';
  const existing = new Map(allTx().map(t => [t.id, t]));
  const items = [];
  for (const f of files) {
    try {
      const st = StatementParser.parse(await pdfItems(await f.arrayBuffer()));
      if (!st) { S.pendingImport = { file: f.name, error: 'Это не похоже на выписку Kaspi Gold или Freedom Bank. Скачайте выписку в приложении банка в формате PDF.' }; render(); return; }
      if (!st.rows.length) { S.pendingImport = { file: f.name, error: 'В файле не нашлось ни одной операции.' }; render(); return; }
      const impId = 'imp_' + uid();
      const txs = Ledger.fromStatement(st, S.meta.rules, impId);
      const fresh = txs.filter(t => !existing.has(t.id));
      items.push({ file: f.name, st, rec: Ledger.reconcile(st), fresh, dup: txs.length - fresh.length, impId, links: 0 });
      for (const t of fresh) existing.set(t.id, t);
    } catch (e) {
      S.pendingImport = { file: f.name, error: 'Не удалось открыть PDF. Если файл защищён паролем, скачайте выписку заново без пароля.' }; render(); return;
    }
  }
  // Ищем переводы между своими картами среди новых и ещё не связанных старых операций.
  const freshSet = new Set(items.flatMap(it => it.fresh));
  const pool = [...freshSet, ...allTx().filter(t => !t.link && !t.manual && !t.edited).map(t => ({ ...t, _orig: true }))];
  const links = Ledger.linkTransfers(pool);
  const touched = [];
  for (const [a, b] of links) for (const x of [a, b]) {
    const it = items.find(i => i.fresh.includes(x));
    if (it) it.links++; else if (x._orig) touched.push(x);
  }
  S.pendingImport = { items, touched };
  render();
}

function commitImport() {
  const p = S.pendingImport;
  if (!p || p.error) return;
  let added = 0, matched = 0;
  const quick = allTx().filter(t => t.quick);
  for (const it of p.items) {
    for (const t of it.fresh) {
      // Трата из Apple Pay или SMS уже записана — оставляем банковскую строку, переносим правки и заметку.
      const q = Ledger.matchQuick(t, quick);
      if (q) {
        q._used = true; dropTx(q); matched++;
        if (q.edited) { t.kind = q.kind; t.cat = q.cat; t.edited = true; }
        if (q.note) t.note = q.note;
      }
      putTx(t); added++;
    }
    const prev = {};
    for (const b of it.st.balances) {
      const old = S.meta.accounts[b.key];
      if (!old || old.date <= b.date) { prev[b.key] = old || null; S.meta.accounts[b.key] = { name: b.name, bank: b.bank, cur: b.cur, cents: b.cents, date: b.date }; }
    }
    const auto = Ledger.ratesFromConversions(it.fresh);
    for (const r of auto) if (!S.meta.rates.some(x => x.cur === r.cur && x.date === r.date)) S.meta.rates.push(r);
    S.meta.imports.push({ id: it.impId, bank: it.st.bank, from: it.st.period?.from || it.fresh[it.fresh.length - 1]?.date || today(),
      to: it.st.period?.to || today(), at: new Date().toISOString(), added: it.fresh.length, prev });
  }
  for (const x of p.touched) { const t = { ...x }; delete t._orig; putTx(t); }
  saveMeta();
  S.pendingImport = null;
  const latest = p.items.flatMap(i => i.fresh).map(t => t.date).sort().pop();
  if (latest) S.month = monthOf(latest);
  S.view = 'overview'; render();
  toast(`Загружено операций: ${added}` + (matched ? `. Совпало с Apple Pay и SMS: ${matched}` : ''));
}

function undoImport(id) {
  const imp = S.meta.imports.find(i => i.id === id);
  if (!imp) return;
  const gone = allTx().filter(t => t.imp === id);
  const goneIds = new Set(gone.map(t => t.id));
  for (const t of gone) dropTx(t);
  for (const t of allTx()) if (t.link && goneIds.has(t.link)) {
    delete t.link; Object.assign(t, Ledger.classify(t, S.meta.rules)); putTx(t);
  }
  for (const [k, v] of Object.entries(imp.prev || {})) { if (v) S.meta.accounts[k] = v; else delete S.meta.accounts[k]; }
  S.meta.imports = S.meta.imports.filter(i => i.id !== id);
  saveMeta(); render(); toast(`Удалено операций: ${gone.length}`);
}

/* ---------- Резервная копия ---------- */
async function exportBackup() {
  const data = JSON.stringify({ app: 'svodny-koshelek', v: 1, at: new Date().toISOString(), meta: S.meta, months: S.months });
  const name = `koshelek-${today()}.json`;
  const file = new File([data], name, { type: 'application/json' });
  const done = msg => { S.meta.lastBackup = today(); saveMeta(); render(); toast(msg); };
  try {
    const dl = await window.claude?.use?.('downloads');
    if (dl) { const r = await dl.save({ filename: name, data: file }); if (r && r.status === 'saved') done('Копия сохранена'); return; }
  } catch (e) { if (e && e.code !== 'unavailable') return; }
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); done('Копия сохранена'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (!window.claude) try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); done('Файл сохранён в «Загрузки»'); return;
  } catch {}
  openSheet(`<h3>Резервная копия</h3><div class="note">Сохранить файл из этого окна нельзя. Скопируйте текст и сохраните его в Заметки или Файлы.</div>
    <textarea rows="8" readonly id="bkTxt">${esc(data)}</textarea><div class="btns"><button class="btn primary" id="bkCopy">Скопировать</button><button class="btn" id="bkClose">Закрыть</button></div>`, root => {
    root.querySelector('#bkClose').onclick = () => sheet.close();
    root.querySelector('#bkCopy').onclick = () => {
      navigator.clipboard.writeText(data).then(() => toast('Скопировано'), () => { const t = root.querySelector('#bkTxt'); t.focus(); t.select(); });
    };
  });
}
async function importBackup(file) {
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'svodny-koshelek' || !d.months) throw 0;
    let n = 0;
    for (const m of Object.values(d.months)) for (const t of Object.values(m)) { if (!findTx(t.id)) n++; putTx(t); }
    S.meta = { ...S.meta, ...d.meta, rules: { ...S.meta.rules, ...(d.meta?.rules || {}) } };
    saveMeta(); render(); toast(`Восстановлено. Новых операций: ${n}`);
  } catch { toast('Это не файл резервной копии этого приложения'); }
}
function wipe(btn) {
  if (!btn.dataset.armed) { btn.dataset.armed = '1'; btn.textContent = 'Точно удалить всё? Нажмите ещё раз'; return; }
  for (const id of Object.keys(S.months)) { S.months[id] = {}; markDirty(id); }
  S.meta = { accounts: {}, deposits: [], rates: [], rules: {}, imports: [], cash: { cents: 0, date: today() } };
  saveMeta(); render(); toast('Все данные удалены');
}

/* ---------- События ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-v],[data-go],[data-act],[data-tx],[data-cat],[data-undo],[data-dep],[data-delrate],#opsFilter button');
  if (!el) return;
  if (el.dataset.v || el.dataset.go) { S.view = el.dataset.v || el.dataset.go; S.shown = 80; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.f) { S.filter = el.dataset.f; S.shown = 80; render(); return; }
  if (el.dataset.tx) { const t = findTx(el.dataset.tx); if (t) openTx(t); return; }
  if (el.dataset.cat) { S.cat = el.dataset.cat; S.filter = 'expense'; S.view = 'ops'; render(); window.scrollTo(0, 0); return; }
  if (el.dataset.undo) {
    if (el.dataset.armed) undoImport(el.dataset.undo);
    else { el.dataset.armed = '1'; el.textContent = 'Точно?'; }
    return;
  }
  if (el.dataset.dep) { openDeposit((S.meta.deposits || []).find(d => d.id === el.dataset.dep)); return; }
  if (el.dataset.delrate) { const [c, d] = el.dataset.delrate.split('|'); S.meta.rates = S.meta.rates.filter(r => !(r.cur === c && r.date === d)); saveMeta(); render(); return; }
  const a = el.dataset.act;
  if (a === 'add') openAdd();
  if (a === 'budget') openBudget();
  if (a === 'copyquick') {
    const txt = location.origin + location.pathname + '?src=applepay&t=';
    navigator.clipboard.writeText(txt).then(() => toast('Ссылка скопирована'), () => {
      const r = document.createRange(); r.selectNodeContents($('#quickUrl'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Выделено — нажмите «Скопировать»');
    });
  }
  if (a === 'more') { S.shown += 80; render(); }
  if (a === 'clearcat') { S.cat = null; render(); }
  if (a === 'commit') commitImport();
  if (a === 'cancelimp') { S.pendingImport = null; render(); }
  if (a === 'adddep') openDeposit(null);
  if (a === 'cash') openCash();
  if (a === 'export') exportBackup();
  if (a === 'wipe') wipe(el);
  if (a === 'addrate') {
    const rate = parseFloat(String($('#rVal').value).replace(',', '.'));
    if (!rate || rate <= 0) { toast('Введите курс, например 520'); return; }
    const r = { cur: $('#rCur').value, date: $('#rDate').value || today(), rate };
    S.meta.rates = S.meta.rates.filter(x => !(x.cur === r.cur && x.date === r.date)).concat([r]);
    saveMeta(); render(); toast('Курс добавлен');
  }
});
$('#addBtn').onclick = openAdd;
$('#mPrev').onclick = () => { S.month = shiftMonth(S.month, -1); S.shown = 80; render(); };
$('#mNext').onclick = () => { S.month = shiftMonth(S.month, 1); S.shown = 80; render(); };
$('#q').addEventListener('input', e => { S.q = e.target.value; S.shown = 80; renderOps(); });
$('#pdfIn').addEventListener('change', e => { handleFiles([...e.target.files]); e.target.value = ''; });
document.addEventListener('change', e => { if (e.target.id === 'backupIn' && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ''; } });
const drop = $('#drop');
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); handleFiles([...e.dataTransfer.files].filter(f => /pdf$/i.test(f.name) || f.type === 'application/pdf')); });

initStore();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
